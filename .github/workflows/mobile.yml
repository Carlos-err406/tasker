name: Mobile (Android)

# OTA JS updates on every push to main (installed APKs self-update on next launch),
# and a fresh APK build on release tags (needed when native code changes).
on:
  workflow_dispatch:
  push:
    branches: [main, feat/powersync-sync]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  ota-update:
    name: OTA update (JS)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Scope to mobile + its workspace deps (core) — avoids installing desktop-only
      # native deps (electron/eventkit-node) whose build scripts pnpm 11 refuses to run in CI.
      - run: pnpm install --filter "@tasker/mobile..." --no-frozen-lockfile
      - run: pnpm --filter @tasker/core run build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA update
        working-directory: apps/mobile
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive

  build-apk:
    name: Build APK
    # Runs on release tags, manual dispatch, or a push to the feature branch (so we can
    # get an APK before merging). Builds LOCALLY on the runner (Android SDK is preinstalled)
    # via `eas build --local` — no EAS cloud queue — and uploads the APK as an artifact.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/powersync-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Scope to mobile + its workspace deps (core) — avoids installing desktop-only
      # native deps (electron/eventkit-node) whose build scripts pnpm 11 refuses to run in CI.
      - run: pnpm install --filter "@tasker/mobile..." --no-frozen-lockfile
      - run: pnpm --filter @tasker/core run build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android APK on the runner (no EAS queue)
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output "${{ github.workspace }}/tasker.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasker-android-apk
          path: ${{ github.workspace }}/tasker.apk
          if-no-files-found: error
