name: Mobile (Android)

# OTA JS updates on every push to main (installed APKs self-update on next launch),
# and a fresh APK build on release tags (needed when native code changes).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  ota-update:
    name: OTA update (JS)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://pwiyqxspyoxcbcwdjbxz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_lm3gHsZ1adKpolqLf25oGg_SgEI6hET
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Scope to mobile + its workspace deps (core) — avoids installing desktop-only
      # native deps (electron/eventkit-node) whose build scripts pnpm 11 refuses to run in CI.
      - name: Install (mobile scope)
        # --ignore-scripts: dependency build scripts (esbuild etc.) aren't needed for the
        # Metro bundle, and pnpm 11 hard-errors on ignored ones in CI. Core's own build runs
        # next (and again inside the EAS build via the eas-build-post-install hook).
        run: pnpm install --filter "@tasker/mobile..." --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter @tasker/core run build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Ensure preview update channel points to preview branch
        working-directory: apps/mobile
        run: |
          eas channel:create preview --non-interactive || true
          eas channel:edit preview --branch preview --non-interactive
      - name: Publish OTA update
        working-directory: apps/mobile
        # --platform android only: web isn't a target, and native mobile modules can
        # break Metro's static web render.
        run: eas update --branch preview --platform android --message "${{ github.event.head_commit.message }}" --non-interactive

  build-apk:
    name: Build APK
    # Builds the APK ENTIRELY on the GitHub runner (Android SDK preinstalled) via
    # `expo prebuild` + Gradle — no EAS cloud, no queue, no EAS-internal installer.
    # Uploads the APK as a downloadable artifact. Release variant is debug-signed (Expo's
    # default) so it installs via sideload. Env vars bake the (non-secret) Supabase creds
    # into the JS bundle. @tasker/core is built first and used straight off the runner FS.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://pwiyqxspyoxcbcwdjbxz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_lm3gHsZ1adKpolqLf25oGg_SgEI6hET
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --filter "@tasker/mobile..." --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter @tasker/core run build
      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Raise Gradle JVM memory (Expo default caps Metaspace at 512m → OOM)
        run: printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g\n' >> apps/mobile/android/gradle.properties
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Assemble release APK (Gradle, signed with stable keystore)
        working-directory: apps/mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # android.injected.signing.* overrides the generated build.gradle signingConfig so the
        # release APK is signed with our stable keystore → future builds install over cleanly.
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasker-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
