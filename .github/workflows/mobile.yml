name: Mobile (Android)

# OTA JS updates on every push to main (installed APKs self-update on next launch),
# and a fresh APK build on release tags (needed when native code changes).
on:
  workflow_dispatch:
  push:
    branches: [main, feat/powersync-sync]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  ota-update:
    name: OTA update (JS)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Scope to mobile + its workspace deps (core) — avoids installing desktop-only
      # native deps (electron/eventkit-node) whose build scripts pnpm 11 refuses to run in CI.
      - name: Install (mobile scope)
        # --ignore-scripts: dependency build scripts (esbuild etc.) aren't needed for the
        # Metro bundle, and pnpm 11 hard-errors on ignored ones in CI. Core's own build runs
        # next (and again inside the EAS build via the eas-build-post-install hook).
        run: pnpm install --filter "@tasker/mobile..." --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter @tasker/core run build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA update
        working-directory: apps/mobile
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive

  build-apk:
    name: Build APK
    # Triggers an EAS CLOUD build (APK). `eas build --local` on the runner is blocked by
    # EAS's internal pnpm install choking on the monorepo's build scripts, which we can't
    # flag. The cloud build handles the monorepo + credentials; the eas-build-post-install
    # hook builds @tasker/core. Since OTA (eas update) delivers JS changes, an APK rebuild
    # is only needed for native changes, so the cloud queue is a rare, one-time cost.
    # The finished APK is downloadable from the EAS build page (link printed in the log).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/powersync-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # node_modules must exist so `eas build` can analyze the project (resolve the
      # expo-router config plugin + compute the fingerprint) before submitting to the cloud.
      - run: pnpm install --filter "@tasker/mobile..." --ignore-scripts --no-frozen-lockfile
      - run: pnpm --filter @tasker/core run build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Trigger EAS cloud build (APK)
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait
